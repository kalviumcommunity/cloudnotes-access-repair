services:
  app:
    build: .
    environment:
      BIND: 127.0.0.1
      DATABASE_URL: postgresql://demo:local_demo_only@db:5432/notes
    ports: ["127.0.0.1:18095:8080"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: notes
    ports: ["127.0.0.1:15495:5432"]
    volumes: ["notes-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d notes"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  notes-data:
